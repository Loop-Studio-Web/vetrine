name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # v6: salva in cache anche node_modules/.astro (immagini già ottimizzate), così le build
      # non rifanno tutto da capo a ogni push man mano che i concept crescono (v3 non lo faceva).
      - uses: withastro/action@v6
        with:
          # Astro 7 richiede Node >=22.12 (stesso vincolo di "engines" in
          # package.json) — senza questo il runner usa Node 20 di default
          # e la build fallisce subito.
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
