name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # v6: salva in cache anche node_modules/.astro (immagini già ottimizzate), così le build
      # non rifanno tutto da capo a ogni push man mano che i concept crescono (v3 non lo faceva).
      - uses: withastro/action@v6
        with:
          # Astro 7 richiede Node >=22.12 (vincolo "engines" in package.json). Si usa il 24, la LTS
          # attuale: è la stessa versione con cui si lavora in locale, quindi niente differenze tra
          # PC e deploy (il 22 va in fine supporto ad aprile 2027).
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
