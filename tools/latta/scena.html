<!doctype html>
<meta charset="utf-8" />
<title>Scena latta</title>
<!-- La latta in 3D, solo per fare le immagini (render.mjs). Mai caricata dal sito. -->
<style>
	html,
	body {
		margin: 0;
		background: transparent;
	}
	canvas {
		display: block;
	}
</style>
<script type="importmap">
	{ "imports": { "three": "/three/build/three.module.js", "three/addons/": "/three/examples/jsm/" } }
</script>
<script type="module">
	import * as THREE from 'three';
	import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
	import { FORMATI, FASCIA, giro } from './misure.js';

	const q = new URLSearchParams(location.search);
	const W = Number(q.get('w') || 600);
	const H = Number(q.get('h') || 1000);
	const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
	renderer.setPixelRatio(1);
	renderer.setSize(W, H);
	renderer.toneMapping = THREE.NeutralToneMapping;
	renderer.toneMappingExposure = Number(q.get('esp') || 1);
	renderer.outputColorSpace = THREE.SRGBColorSpace;
	renderer.shadowMap.enabled = true;
	renderer.shadowMap.type = THREE.PCFSoftShadowMap;
	document.body.append(renderer.domElement);

	const scena = new THREE.Scene();
	const pmrem = new THREE.PMREMGenerator(renderer);
	const hdr = await new RGBELoader().loadAsync(q.get('hdr') || './studio_small_03.hdr');
	if (q.get('env') === 'box') {
		// studio fotografico: l'HDRI come fondo e due softbox alti + uno sopra, che fanno i riflessi verticali
		const studio = new THREE.Scene();
		const cielo = new THREE.Mesh(new THREE.SphereGeometry(500, 64, 32), new THREE.MeshBasicMaterial({ map: hdr, side: THREE.BackSide, color: new THREE.Color().setScalar(Number(q.get('fondo') || 2.5)) }));
		hdr.mapping = THREE.EquirectangularReflectionMapping;
		studio.add(cielo);
		const box = (x, y, z, w, h, i, ry = 0, rx = 0) => {
			const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(i, i, i), side: THREE.DoubleSide }));
			m.position.set(x, y, z);
			m.rotation.set(rx, ry, 0);
			studio.add(m);
		};
		const k = Number(q.get('box') || 6);
		box(-90, 20, 60, 26, 160, k, Math.PI / 3.2);
		box(110, 20, 10, 18, 160, k * 0.55, -Math.PI / 2.4);
		box(0, 140, 0, 120, 60, k * 0.5, 0, Math.PI / 2);
		box(20, 10, -120, 60, 100, k * 0.25);
		scena.environment = pmrem.fromScene(studio, 0.02, 0.1, 1000).texture;
	} else scena.environment = pmrem.fromEquirectangular(hdr).texture;
	scena.environmentRotation = new THREE.Euler(0, Number(q.get('envrot') || 0.6), 0);
	scena.environmentIntensity = Number(q.get('envi') || 1.2);

	// luce di taglio per il riflesso verticale sugli spigoli + ombra a terra
	const key = new THREE.DirectionalLight(0xffffff, 1.4);
	key.position.set(-30, 60, 40);
	key.castShadow = true;
	key.shadow.mapSize.set(2048, 2048);
	key.shadow.camera.left = -40;
	key.shadow.camera.right = 40;
	key.shadow.camera.top = 40;
	key.shadow.camera.bottom = -40;
	key.shadow.radius = 6;
	scena.add(key);

	const camera = new THREE.PerspectiveCamera(18, W / H, 1, 1000);

	const caricaImg = (url) => new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = url; });
	const tex = (img, srgb = true) => {
		const t = new THREE.Texture(img);
		t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
		t.anisotropy = renderer.capabilities.getMaxAnisotropy();
		t.needsUpdate = true;
		return t;
	};
	// metallo nudo dove l'etichetta ha il colore della latta (bande e fondo del retro): il resto è inchiostro laccato
	const mappaMetallo = (img) => {
		const c = document.createElement('canvas');
		c.width = img.width >> 1;
		c.height = img.height >> 1;
		const g = c.getContext('2d');
		g.drawImage(img, 0, 0, c.width, c.height);
		const d = g.getImageData(0, 0, c.width, c.height);
		for (let i = 0; i < d.data.length; i += 4) {
			const dr = d.data[i] - 207, dg = d.data[i + 1] - 213, db = d.data[i + 2] - 216;
			const v = Math.max(0, 1 - Math.sqrt(dr * dr + dg * dg + db * db) / 38);
			// G = ruvidità, B = metallo (convenzione di three)
			d.data[i] = 255;
			d.data[i + 1] = 255 * (0.34 + v * 0.14);
			d.data[i + 2] = 255 * v;
			d.data[i + 3] = 255;
		}
		g.putImageData(d, 0, 0);
		return tex(c, false);
	};

	const buccia = (() => {
		const c = document.createElement('canvas');
		c.width = c.height = 512;
		const g = c.getContext('2d');
		const d = g.createImageData(512, 512);
		const n = new Float32Array(512 * 512).map(() => Math.random());
		for (let y = 0; y < 512; y++)
			for (let x = 0; x < 512; x++) {
				const i = y * 512 + x;
				const dx = n[i] - n[y * 512 + ((x + 1) & 511)];
				const dy = n[i] - n[((y + 1) & 511) * 512 + x];
				d.data[i * 4] = 128 + dx * 40;
				d.data[i * 4 + 1] = 128 + dy * 40;
				d.data[i * 4 + 2] = 255;
				d.data[i * 4 + 3] = 255;
			}
		g.putImageData(d, 0, 0);
		g.filter = 'blur(1.5px)';
		g.drawImage(c, 0, 0);
		const t = tex(c, false);
		t.wrapS = t.wrapT = THREE.RepeatWrapping;
		t.repeat.set(10, 7);
		return t;
	})();

	function costruisci(f, etichetta) {
		const M = FORMATI[f];
		const { perimetro } = giro(f);
		const gruppo = new THREE.Group();
		const hw = M.w / 2 - M.r, hd = M.d / 2 - M.r;
		// il perimetro arrotondato, da u = 0 all'inizio del fronte, in senso antiorario visto dall'alto
		const punti = [];
		const passo = (x, z, nx, nz) => punti.push({ x, z, nx, nz });
		const arcoDa = (cx, cz, a0, a1) => {
			for (let k = 0; k <= 16; k++) {
				const a = a0 + (k / 16) * (a1 - a0);
				passo(cx + Math.cos(a) * M.r, cz + Math.sin(a) * M.r, Math.cos(a), Math.sin(a));
			}
		};
		passo(-hw, M.d / 2, 0, 1);
		arcoDa(hw, hd, Math.PI / 2, 0); // fronte → spigolo destro
		arcoDa(hw, -hd, 0, -Math.PI / 2); // fianco destro → spigolo dietro
		arcoDa(-hw, -hd, -Math.PI / 2, -Math.PI); // retro → spigolo
		arcoDa(-hw, hd, Math.PI, Math.PI / 2); // fianco sinistro → spigolo davanti
		// u per lunghezza d'arco
		let s = 0;
		const us = [0];
		for (let i = 1; i < punti.length; i++) {
			s += Math.hypot(punti[i].x - punti[i - 1].x, punti[i].z - punti[i - 1].z);
			us.push(s);
		}
		const pos = [], nor = [], uv = [], idx = [];
		punti.forEach((p, i) => {
			const u = us[i] / s;
			pos.push(p.x, 0, p.z, p.x, M.h, p.z);
			nor.push(p.nx, 0, p.nz, p.nx, 0, p.nz);
			uv.push(u, 0, u, 1);
			if (i > 0) {
				const a = (i - 1) * 2;
				idx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3);
			}
		});
		const g = new THREE.BufferGeometry();
		g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
		g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
		g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
		g.setIndex(idx);
		const mappa = tex(etichetta);
		const rm = mappaMetallo(etichetta);
		const corpo = new THREE.Mesh(
			g,
			new THREE.MeshPhysicalMaterial({ map: mappa, roughnessMap: rm, metalnessMap: rm, roughness: 1, metalness: 1, clearcoat: 1, clearcoatRoughness: Number(q.get('ccr') || 0.07), clearcoatNormalMap: buccia, clearcoatNormalScale: new THREE.Vector2(0.25, 0.25) }),
		);
		corpo.castShadow = true;
		gruppo.add(corpo);

		// coperchio e fondo: rettangolo arrotondato leggermente incassato
		const forma = new THREE.Shape();
		const R = M.r, X = M.w / 2, Z = M.d / 2;
		forma.moveTo(-X + R, -Z);
		forma.lineTo(X - R, -Z);
		forma.quadraticCurveTo(X, -Z, X, -Z + R);
		forma.lineTo(X, Z - R);
		forma.quadraticCurveTo(X, Z, X - R, Z);
		forma.lineTo(-X + R, Z);
		forma.quadraticCurveTo(-X, Z, -X, Z - R);
		forma.lineTo(-X, -Z + R);
		forma.quadraticCurveTo(-X, -Z, -X + R, -Z);
		const metallo = new THREE.MeshPhysicalMaterial({ color: 0xd9dee1, metalness: 1, roughness: 0.26, clearcoat: 0.4, clearcoatRoughness: 0.2 });
		const coperchio = new THREE.Mesh(new THREE.ShapeGeometry(forma, 24), metallo);
		coperchio.rotation.x = -Math.PI / 2;
		coperchio.position.y = M.h - 0.12;
		gruppo.add(coperchio);
		// anelli stampati nel coperchio (la nervatura che lo irrigidisce)
		const nerv = forma.getPoints(40).map((p) => new THREE.Vector3(p.x * 0.84, 0, p.y * 0.8));
		const tuboN = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(nerv, true), 200, 0.07, 8, true), metallo);
		tuboN.position.y = M.h - 0.12;
		gruppo.add(tuboN);
		// aggraffature sopra e sotto: il bordo arrotolato
		const bordo = forma.getPoints(40).map((p) => new THREE.Vector3(p.x, 0, p.y));
		const curva = new THREE.CatmullRomCurve3(bordo, true);
		for (const y of [M.h + 0.05, 0.12]) {
			const t = new THREE.Mesh(new THREE.TubeGeometry(curva, 260, 0.2, 12, true), metallo);
			t.position.y = y;
			t.scale.set(1.012, 1, 1.016);
			t.castShadow = true;
			gruppo.add(t);
		}
		// il tappo: collo di metallo e tappo di plastica rossa con le righe per la presa
		const tx = X - M.tappo * 1.25, tz = -Z + M.tappo * 1.15;
		const collo = new THREE.Mesh(new THREE.CylinderGeometry(M.tappo * 0.95, M.tappo * 1.05, 0.5, 48), metallo);
		collo.position.set(tx, M.h + 0.1, tz);
		gruppo.add(collo);
		const plastica = new THREE.MeshPhysicalMaterial({ color: 0xc8231b, roughness: 0.38, clearcoat: 0.5, clearcoatRoughness: 0.3 });
		const tappo = new THREE.Mesh(new THREE.CylinderGeometry(M.tappo * 0.86, M.tappo * 0.9, 1.3, 64), plastica);
		tappo.position.set(tx, M.h + 0.95, tz);
		tappo.castShadow = true;
		gruppo.add(tappo);
		for (let k = 0; k < 36; k++) {
			const a = (k / 36) * Math.PI * 2;
			const riga = new THREE.Mesh(new THREE.BoxGeometry(0.12, 1.1, 0.12), plastica);
			riga.position.set(tx + Math.cos(a) * M.tappo * 0.89, M.h + 0.95, tz + Math.sin(a) * M.tappo * 0.89);
			gruppo.add(riga);
		}
		const sigillo = new THREE.Mesh(new THREE.TorusGeometry(M.tappo * 0.88, 0.12, 8, 64), plastica);
		sigillo.rotation.x = Math.PI / 2;
		sigillo.position.set(tx, M.h + 0.36, tz);
		gruppo.add(sigillo);
		return gruppo;
	}

	// terra che riceve solo l'ombra
	const terra = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.ShadowMaterial({ opacity: 0.22 }));
	terra.rotation.x = -Math.PI / 2;
	terra.receiveShadow = true;
	scena.add(terra);

	let latte = [];
	window.prepara = async (formati, ombra = true) => {
		latte.forEach((l) => scena.remove(l));
		latte = [];
		for (const f of formati) {
			const img = await caricaImg(`./out/etichetta-${f}.png`);
			const l = costruisci(f, img);
			l.userData.f = f;
			scena.add(l);
			latte.push(l);
		}
		terra.visible = ombra;
		return latte.length;
	};
	// una posa: angolo di ogni latta (gradi), posizione x, camera (elevazione, distanza, mira)
	window.posa = ({ angoli = [0], xs = [0], zs = [0], elev = 12, dist = 140, mira = 15, fov = 18, envrot }) => {
		latte.forEach((l, i) => {
			l.rotation.y = THREE.MathUtils.degToRad(angoli[i] ?? 0);
			l.position.set(xs[i] ?? 0, 0, zs[i] ?? 0);
		});
		if (envrot !== undefined) scena.environmentRotation.y = envrot;
		camera.fov = fov;
		const e = THREE.MathUtils.degToRad(elev);
		camera.position.set(0, mira + Math.sin(e) * dist, Math.cos(e) * dist);
		camera.lookAt(0, mira, 0);
		camera.updateProjectionMatrix();
		renderer.render(scena, camera);
		return renderer.domElement.toDataURL('image/png');
	};
	window.pronto = true;
</script>
